# OPPO Find X7 Ultra (satellite edition), PHY120, SM8650.
# Every value was measured on the device or parsed from the official
# PHY120domestic_11_16.0.7.200CN01 firmware package.

[board]
name = "PHY120"
soc = "SM8650"
description = "OPPO Find X7 Ultra (PHY120)"
kit = "PHY120"

[ipsw]
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[userdata]
first_lba = 0x4582EC     # GPT "userdata", LUN 0, 4096-byte sectors
last_lba = 0x0           # TODO: read from the device GPT
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "PHY120_defconfig"

[firmware]
config = "PHY120"
dsc = "Platforms/OPPO/PHY120Pkg/PHY120.dsc"
fd = "Build/PHY120Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OPPO",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "PHY120"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "PHY120-research"

[payload]
volume = "PHY120ESP"
size_mib = 24
loader = "firmware"
title = "OPPO Find X7 Ultra - UniXNU"
dram_size = "0x80000000"
panic_screen = true

[payload.adt]
chip_id = "207"
owned_memory_size = "0x130000000"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"

[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xd5100000", "0x0", "0x2b00000"] },
]
